name: Daily Scrape & Sync Job

on:
  schedule:
    # Chạy 3:00 UTC mỗi ngày (~10AM giờ VN)
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # cho phép bấm chạy tay để test

permissions:
  contents: write   # cần quyền này để commit lại manifest.json sau khi chạy

jobs:
  run-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t optibot-job .

      - name: Run job (bind mount toàn bộ workspace để persist manifest.json)
        run: |
          docker run --rm \
            -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            -e VECTOR_STORE_ID=${{ secrets.VECTOR_STORE_ID }} \
            -v ${{ github.workspace }}:/app \
            -w /app \
            optibot-job

      - name: Commit updated manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: update manifest.json [skip ci]"
          git push