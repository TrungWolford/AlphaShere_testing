name: Daily Scrape and Sync Job

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t optibot-job .

      - name: List Docker images (debug)
        run: docker images --format "{{.Repository}}:{{.Tag}}" | sed -n '1,20p'

      - name: Run job
        run: |
          docker run --rm \
            -e "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
            -e "VECTOR_STORE_ID=${{ secrets.VECTOR_STORE_ID }}" \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            optibot-job:latest

      - name: Commit updated manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: update manifest.json [skip ci]"
          git push